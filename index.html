<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17152d"><meta name="description" content="Смешные голосовые фразы для Генача."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Фразы для Генача</title><style>
:root{color-scheme:dark;--ink:#fff9f1;--soft:#c9c5e3;--glass:#ffffff12;--line:#ffffff23;--gold:#ffcc78}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{min-height:100%;background:#17152d}body{margin:0;min-height:100svh;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 50% -10%,#544577 0,#292442 42%,#17152d 100%);padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 22px)}main{width:min(680px,100%);margin:0 auto}.hero{text-align:center;padding:28px 6px 18px}.logo{font-size:40px;filter:drop-shadow(0 0 16px #ffda8a70)}h1{font-size:clamp(25px,7vw,36px);margin:5px 0 5px;letter-spacing:-.04em}.sub{color:var(--soft);font-size:14px}.count{display:inline-block;margin-top:12px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:#ffffff0c;color:#f9e4bd;font-size:12px;font-weight:800;letter-spacing:.06em}.random{width:100%;min-height:56px;margin:2px 0 17px;border:1px solid #ffe1ad55;border-radius:19px;background:linear-gradient(110deg,#ffcb7740,#d07aff30);color:#fff8e8;font:850 17px system-ui;box-shadow:0 10px 30px #09071245;touch-action:manipulation}.random:active,.phrase:active{transform:scale(.98)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.phrase{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:10px;min-height:106px;padding:13px 13px 11px;border:1px solid var(--line);border-radius:17px;background:var(--glass);color:var(--ink);text-align:left;font:750 14px/1.25 system-ui;box-shadow:0 5px 18px #09071225;touch-action:manipulation;transition:transform .12s,border-color .12s,background .12s}.phrase.playing{border-color:#ffcf83c9;background:#ffcf831b}.label{color:#dfcba8;font-size:9px;font-weight:900;letter-spacing:.1em}.note{text-align:center;color:#a9a4c1;font-size:11px;padding:16px 0 5px}@media(max-width:360px){.grid{gap:7px}.phrase{padding:11px 10px;font-size:13px;min-height:112px}}
</style></head><body><main><header class="hero"><div class="logo" aria-hidden="true">🐾🎙️</div><h1>ГЕНАЧ, НА СВЯЗЬ!</h1><div class="sub">Смешные фразы для главного по усам</div><div class="count">33 ФРАЗЫ · ГОЛОС ГЕНАЧА</div></header><button class="random" id="random">🎲 Скажи что-нибудь</button><section class="grid" id="phrases" aria-label="Голосовые фразы"></section><div class="note">Нажми на фразу, чтобы услышать её</div></main><script>
const phrases=[{"text":"Ко мне, Генач!","kind":"КОМАНДА","file":"come"},{"text":"Генач, сюда!","kind":"КОМАНДА","file":"here"},{"text":"Генач, лежать!","kind":"КОМАНДА","file":"lie"},{"text":"Генач, операция «диван» началась!","kind":"СРОЧНЫЙ ВЫЗОВ","file":"phrase-01"},{"text":"Срочно на ковёр, там подозрительная пылинка!","kind":"СРОЧНЫЙ ВЫЗОВ","file":"phrase-02"},{"text":"Начальник усов, вас вызывает миска!","kind":"СРОЧНЫЙ ВЫЗОВ","file":"phrase-03"},{"text":"Генач, патруль по кухне!","kind":"СРОЧНЫЙ ВЫЗОВ","file":"phrase-04"},{"text":"Проверь коробку, она явно что-то скрывает.","kind":"ДЕЛО ВАЖНОЕ","file":"phrase-05"},{"text":"Пушистая тревога! Всё под контролем!","kind":"ДЕЛО ВАЖНОЕ","file":"phrase-06"},{"text":"Ваше величество, хвост наружу.","kind":"ДЕЛО ВАЖНОЕ","file":"phrase-07"},{"text":"Просьба не кусать курьера. Пока.","kind":"ДЕЛО ВАЖНОЕ","file":"phrase-08"},{"text":"Генач, включай режим лежачего тигра.","kind":"ДЕЛО ВАЖНОЕ","file":"phrase-09"},{"text":"Усатый шеф, диван опять захвачен.","kind":"ДЕЛО ВАЖНОЕ","file":"phrase-10"},{"text":"Там мышь-невидимка. Может, ты её слышишь?","kind":"КОТОДЕТЕКТИВ","file":"phrase-11"},{"text":"Внимание, ковёр требует лапу!","kind":"КОТОДЕТЕКТИВ","file":"phrase-12"},{"text":"Лови перышко, оно само напросилось!","kind":"КОТОДЕТЕКТИВ","file":"phrase-13"},{"text":"Генач, срочное совещание у миски.","kind":"КОТОДЕТЕКТИВ","file":"phrase-14"},{"text":"Твои усы сообщают: пора мурчать.","kind":"КОТОДЕТЕКТИВ","file":"phrase-15"},{"text":"Нужен эксперт по коробкам. Генач, ты назначен!","kind":"СУПЕРКОТ","file":"phrase-16"},{"text":"Котоагент, миссия: найти солнечный зайчик!","kind":"СУПЕРКОТ","file":"phrase-17"},{"text":"Пора показать хвосту новый маршрут!","kind":"СУПЕРКОТ","file":"phrase-18"},{"text":"Герой лотка, выходи на связь!","kind":"СУПЕРКОТ","file":"phrase-19"},{"text":"Ты такой быстрый, что мышь уже уволилась!","kind":"СУПЕРКОТ","file":"phrase-20"},{"text":"Генач, глазки включил — сердце растопил!","kind":"СУПЕРКОТ","file":"phrase-21"},{"text":"Лапы готовы? Тогда ловим воздух!","kind":"СУПЕРКОТ","file":"phrase-22"},{"text":"На носу крошка! Повторяю: крошка!","kind":"СУПЕРКОТ","file":"phrase-23"},{"text":"Предъявите мяу-пропуск, пожалуйста.","kind":"МИЛЫЕ ДЕЛА","file":"phrase-24"},{"text":"Тревога: диван просит пройтись кругом!","kind":"МИЛЫЕ ДЕЛА","file":"phrase-25"},{"text":"Я не вторая миска. Хотя могу поговорить.","kind":"МИЛЫЕ ДЕЛА","file":"phrase-26"},{"text":"Пушистый прокурор, дело о рыбке открыто!","kind":"МИЛЫЕ ДЕЛА","file":"phrase-27"},{"text":"Генач, одобряю рабочий план: лежать и мурчать.","kind":"МИЛЫЕ ДЕЛА","file":"phrase-28"},{"text":"Ты прекрасен, а шторы пока целы. Так держать!","kind":"МИЛЫЕ ДЕЛА","file":"phrase-29"},{"text":"Кто тут главный? Кот уже всё решил!","kind":"МИЛЫЕ ДЕЛА","file":"phrase-30"}];
const audios=Object.fromEntries(phrases.map(p=>[p.file,new Audio('./audio/'+p.file+'.mp3')]));
for(const audio of Object.values(audios))audio.preload='none';
const grid=document.querySelector('#phrases');let last=null;
function play(p,button){for(const audio of Object.values(audios)){audio.pause();audio.currentTime=0}document.querySelectorAll('.phrase.playing').forEach(x=>x.classList.remove('playing'));const audio=audios[p.file];last=p.file;if(button)button.classList.add('playing');audio.currentTime=0;audio.play().catch(()=>button?.classList.remove('playing'));audio.onended=()=>button?.classList.remove('playing')}
phrases.forEach(p=>{const b=document.createElement('button');b.className='phrase';b.type='button';b.innerHTML='<span>'+p.text+'</span><span class="label">'+p.kind+'</span>';b.setAttribute('aria-label','Произнести: '+p.text);b.addEventListener('click',()=>play(p,b));grid.append(b)});
document.querySelector('#random').addEventListener('click',()=>{const choices=phrases.filter(p=>p.file!==last);play(choices[Math.floor(Math.random()*choices.length)])});
</script></body></html>
