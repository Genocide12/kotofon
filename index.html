const filters=document.querySelector('#filters'),grid=document.querySelector('#phrases');let current='Все',last=null,visible=[];
const categories=['Все',...new Set(phrases.map(p=>p.category))];
function render(){filters.replaceChildren();for(const category of categories){const b=document.createElement('button');b.className='filter'+(category===current?' active':'');b.type='button';const number=category==='Все'?phrases.length:phrases.filter(p=>p.category===category).length;b.textContent=category+' · '+number;b.setAttribute('aria-pressed',category===current?'true':'false');b.addEventListener('click',()=>{current=category;render()});filters.append(b)}visible=current==='Все'?phrases:phrases.filter(p=>p.category===current);grid.replaceChildren();for(const p of visible){const b=document.createElement('button');b.className='phrase';b.type='button';const text=document.createElement('span');text.textContent=p.text;const label=document.createElement('span');label.className='label';label.textContent=p.category.toUpperCase();b.append(text,label);b.setAttribute('aria-label','Произнести: '+p.text);b.addEventListener('click',()=>play(p,b));grid.append(b)}const n=visible.length,mod100=n%100,mod10=n%10,word=(mod100>=11&&mod100<=14)?'ФРАЗ':mod10===1?'ФРАЗА':(mod10>=2&&mod10<=4)?'ФРАЗЫ':'ФРАЗ';document.querySelector('#count').textContent=n+' '+word+' · ГОЛОС ГЕНАЧА';document.querySelector('#note').textContent=current==='Все'?'Нажми на фразу, чтобы услышать её':'Раздел: '+current.toLowerCase()}
