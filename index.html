<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a30">
<meta name="description" content="Игра для кота на телефоне: рыбка, мышка и перышко бегают по экрану.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>КотоОхота для Генача</title>
<style>
:root{color-scheme:dark;--ink:#f6f5ff;--soft:#d2dcf3;--glass:#101a30c9;--line:#ffffff26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a30;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none}
body{min-height:100svh;background:radial-gradient(ellipse at 50% 110%,#62749b 0,#273958 46%,#101a30 100%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 34%,#070d1870 100%)}
header{position:fixed;z-index:2;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;transition:opacity .25s,transform .25s}
.brand{display:flex;gap:9px;align-items:center;text-shadow:0 2px 14px #0008}.brand-icon{font-size:26px;filter:drop-shadow(0 0 10px #ffe2a8)}.brand-name{font-weight:900;font-size:15px;letter-spacing:.06em}.brand-sub{font-size:10px;color:var(--soft);margin-top:1px}
.actions{display:flex;gap:8px;pointer-events:auto}.pill{border:1px solid var(--line);background:var(--glass);color:white;border-radius:999px;min-width:44px;height:42px;padding:0 12px;font:700 15px system-ui;backdrop-filter:blur(12px);box-shadow:0 5px 20px #0003}.pill:active{transform:scale(.94)}
.score{position:fixed;z-index:2;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);padding:8px 15px;border:1px solid #ffffff23;background:#14213cac;border-radius:999px;color:#eff4ff;font-weight:800;font-size:12px;letter-spacing:.06em;backdrop-filter:blur(10px);pointer-events:none;transition:opacity .25s}
.hint{position:fixed;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:#17243bba;color:#e2ebff;border:1px solid #ffffff1c;font-size:11px;white-space:nowrap;backdrop-filter:blur(10px);pointer-events:none;transition:opacity .5s}
#toast{position:fixed;z-index:3;left:50%;top:42%;transform:translate(-50%,-50%) scale(.75);font-size:clamp(30px,10vw,62px);font-weight:950;color:#fff2b9;text-shadow:0 0 24px #ffd35c,0 4px 20px #0008;opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#installTip{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom) + 58px);width:min(340px,calc(100% - 28px));padding:14px 16px;border-radius:18px;background:#101a30ed;border:1px solid #ffffff30;box-shadow:0 15px 50px #0008;font-size:13px;line-height:1.4;text-align:center;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:.2s}
#installTip.show{opacity:1;transform:translate(-50%,0)}
.immersive header{padding-top:calc(env(safe-area-inset-top) + 8px)}.immersive .brand,.immersive .score,.immersive .hint{opacity:0;pointer-events:none}.immersive header{justify-content:flex-end;opacity:.7}.immersive #full{min-width:42px}
@media (orientation:landscape){.score{top:calc(env(safe-area-inset-top) + 12px);left:50%;}.hint{bottom:calc(env(safe-area-inset-bottom) + 8px)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="scene" aria-label="КотоОхота: рыбка, мышка и перышко"></canvas><div class="glow"></div>
<header><div class="brand"><span class="brand-icon">🐾</span><div><div class="brand-name">КОТООХОТА</div><div class="brand-sub">для Генача</div></div></div><div class="actions"><button class="pill" id="pause" aria-label="Пауза">Ⅱ</button><button class="pill" id="sound" aria-label="Звук выключен">🔇</button><button class="pill" id="full" aria-label="Полный экран">⛶</button></div></header>
<div class="score" id="score">ПОЙМАНО · 0</div><div class="hint" id="hint">Положи телефон на пол и дай лапке охотиться</div><div id="toast">Поймал!</div><div id="installTip"></div>
<script>
(()=>{
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=document.querySelector('#score'),hint=document.querySelector('#hint'),toast=document.querySelector('#toast'),tip=document.querySelector('#installTip');
let w=0,h=0,dpr=1,last=0,score=0,paused=false,soundOn=false,audio=null,toastTimer=0,tipTimer=0;
const toyNames=['fish','mouse','feather'];let toyIndex=0;
const target={x:.52,y:.53,vx:.2,vy:.13,r:58,kind:toyNames[0],phase:0,turn:0,angle:0};
const particles=[];
// These self-contained SVG drawings are embedded in the page; the game loads no external images.
const drawings={
 fish:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75e5f3"/><stop offset=".55" stop-color="#4cb7e5"/><stop offset="1" stop-color="#3974cf"/></linearGradient><linearGradient id="f" x1="0" x2="1"><stop stop-color="#ffb76b"/><stop offset="1" stop-color="#ff6e83"/></linearGradient><radialGradient id="g"><stop stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><ellipse cx="90" cy="70" rx="64" ry="45" fill="url(#b)" stroke="#dcffff" stroke-width="4"/><path d="M35 70 2 38q-9 32 0 64z" fill="url(#f)" stroke="#ffd7bc" stroke-width="3" stroke-linejoin="round"/><path d="M79 30 98 9q15 21 26 33M80 110l19 21q16-18 26-36" fill="#ffbc77" stroke="#ffe6b4" stroke-width="4" stroke-linejoin="round"/><path d="M51 48q13 22 0 44m19-53q14 30 0 61m20-62q12 30 0 60" fill="none" stroke="#d5fbff" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/><ellipse cx="112" cy="67" rx="30" ry="19" fill="url(#g)"/><circle cx="130" cy="58" r="7" fill="#182a50"/><circle cx="132" cy="56" r="2.2" fill="white"/><path d="M129 75q8 7 15 0" fill="none" stroke="#25406a" stroke-width="3" stroke-linecap="round"/><path d="M48 89q28 17 64 8" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/></svg>`,
 mouse:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 150"><defs><linearGradient id="m" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f1efff"/><stop offset=".55" stop-color="#b9bce7"/><stop offset="1" stop-color="#858fbd"/></linearGradient><linearGradient id="e"><stop stop-color="#ffc2d4"/><stop offset="1" stop-color="#ed829e"/></linearGradient></defs><path d="M41 88C17 99 25 129 7 124 0 121 3 109 11 106" fill="none" stroke="#f1a7bd" stroke-width="7" stroke-linecap="round"/><ellipse cx="89" cy="87" rx="57" ry="39" fill="url(#m)" stroke="#fff" stroke-width="4"/><circle cx="126" cy="61" r="25" fill="url(#m)" stroke="#fff" stroke-width="4"/><circle cx="112" cy="37" r="17" fill="url(#e)" stroke="#e5e6ff" stroke-width="4"/><circle cx="145" cy="43" r="14" fill="url(#e)" stroke="#e5e6ff" stroke-width="4"/><circle cx="116" cy="38" r="8" fill="#ffe4eb"/><circle cx="145" cy="43" r="7" fill="#ffe4eb"/><ellipse cx="145" cy="72" rx="5" ry="4" fill="#ef829a"/><circle cx="132" cy="56" r="4.5" fill="#192b49"/><circle cx="133" cy="55" r="1.4" fill="white"/><path d="M150 76q19-8 29-4m-28 9q18 0 26 5" fill="none" stroke="#657392" stroke-width="2.4" stroke-linecap="round"/><path d="M63 115q7 12 17 1m20 1q8 11 16-2" fill="none" stroke="#eaa9bb" stroke-width="5" stroke-linecap="round"/><ellipse cx="68" cy="84" rx="15" ry="8" fill="#fff" opacity=".45"/></svg>`,
 feather:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 190"><defs><linearGradient id="p" x1="0" y1="1" x2=".8" y2="0"><stop stop-color="#ff9e9e"/><stop offset=".48" stop-color="#ffd779"/><stop offset="1" stop-color="#7fe0dc"/></linearGradient></defs><path d="M68 178C45 130 25 99 31 52 35 19 72 9 107 7c8 54-3 97-39 171Z" fill="url(#p)" stroke="#fff2c6" stroke-width="4" stroke-linejoin="round"/><path d="M66 177Q71 76 102 14M70 145 39 70m35 51 35-35M65 105 39 55m40 25 27-30M62 76 48 38" fill="none" stroke="#fff7df" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/><path d="M66 178q-9 5-20 4" fill="none" stroke="#d8c7a2" stroke-width="4" stroke-linecap="round"/></svg>`
};
const sprites={};for(const key of Object.keys(drawings)){const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(drawings[key]);sprites[key]=img}
const stars=Array.from({length:58},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.7+.3,a:Math.random()*.5+.15,p:Math.random()*7}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);target.r=Math.max(50,Math.min(74,Math.min(w,h)*.14))}addEventListener('resize',resize);resize();
function nextToy(){toyIndex=(toyIndex+1)%toyNames.length;target.kind=toyNames[toyIndex];target.turn=0}
function playSound(){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(600,audio.currentTime);o.frequency.exponentialRampToValueAtTime(880,audio.currentTime+.1);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.16);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}catch{}}
function burst(x,y){for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,s=38+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-45,life:.65+Math.random()*.55,max:1.2,size:3+Math.random()*6,emoji:Math.random()<.25?'🐾':'✦'})}}
function catchIt(x,y){score++;scoreEl.textContent='ПОЙМАНО · '+score;burst(x,y);playSound();toast.textContent=['Поймал!','Молодец!','Есть!'][Math.floor(Math.random()*3)];toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),570);nextToy();target.x=.14+Math.random()*.72;target.y=.22+Math.random()*.58;target.vx=(Math.random()<.5?-1:1)*(.16+Math.random()*.24);target.vy=(Math.random()<.5?-1:1)*(.12+Math.random()*.2)}
function pointer(e){const x=e.clientX/w,y=e.clientY/h,dx=(x-target.x)*w,dy=(y-target.y)*h;if(Math.hypot(dx,dy)<target.r*1.95)catchIt(target.x*w,target.y*h);else{target.vx+=(x<target.x?.05:-.05);target.vy+=(y<target.y?.035:-.035)}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e)},{passive:false});
function drawBackdrop(t){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#101a30');g.addColorStop(.47,'#263959');g.addColorStop(1,'#7085a9');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 const moon=ctx.createRadialGradient(w*.78,h*.18,2,w*.78,h*.18,Math.min(w,h)*.3);moon.addColorStop(0,'#b4c9f42a');moon.addColorStop(1,'#b4c9f400');ctx.fillStyle=moon;ctx.fillRect(0,0,w,h);
 for(const s of stars){ctx.fillStyle=`rgba(225,237,255,${s.a*(.58+.42*Math.sin(t*1.1+s.p))})`;ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()}
 // soft, overlapping pond lights
 for(let i=0;i<4;i++){const x=w*(.14+i*.24),y=h*(.83+Math.sin(t*.45+i)*.015);ctx.strokeStyle=`rgba(201,225,255,${.09-i*.012})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,Math.min(w*.16,100)+Math.sin(t+i)*4,8+i*3,0,0,Math.PI*2);ctx.stroke()}
 const floor=ctx.createRadialGradient(w*.5,h*.96,0,w*.5,h*.96,Math.max(w,h)*.76);floor.addColorStop(0,'#b6caea3b');floor.addColorStop(1,'#b6caea00');ctx.fillStyle=floor;ctx.fillRect(0,0,w,h)
}
function drawToy(x,y,r,t){ctx.save();const bob=Math.sin(t*3.2)*r*.1,swim=target.kind==='fish'?Math.sin(t*3.8)*.13:target.kind==='feather'?Math.sin(t*4)*.5:Math.sin(t*2.5)*.08;ctx.translate(x,y+bob);ctx.rotate(target.angle+swim);const img=sprites[target.kind];const size=r*2.55;
 // soft shadow and glowing lure
 ctx.save();ctx.rotate(-target.angle-swim);const halo=ctx.createRadialGradient(0,0,r*.15,0,0,r*1.9);halo.addColorStop(0,'#ffeebc43');halo.addColorStop(1,'#ffeebc00');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,r*1.9,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.shadowColor='#050b18a8';ctx.shadowBlur=18;ctx.shadowOffsetY=9;if(img?.complete&&img.naturalWidth)ctx.drawImage(img,-size/2,-size/2,size,size);ctx.restore();
 // toy twinkles
 if(Math.sin(t*5)>0.97){ctx.fillStyle='#fff2b8';ctx.font=`${r*.25}px system-ui`;ctx.fillText('✦',x+r*1.08,y-r*.8)}
}
function frame(ts){requestAnimationFrame(frame);const t=ts/1000,dt=Math.min(.035,(ts-last)/1000||0);last=ts;drawBackdrop(t);
 if(!paused){target.phase+=dt;target.turn+=dt;const boost=1+Math.min(score,15)*.014;target.x+=target.vx*dt*boost;target.y+=target.vy*dt*boost;const b={l:.1,r:.9,top:.2,bottom:.87};if(target.x<b.l||target.x>b.r){target.vx*=-1;target.x=Math.max(b.l,Math.min(b.r,target.x))}if(target.y<b.top||target.y>b.bottom){target.vy*=-1;target.y=Math.max(b.top,Math.min(b.bottom,target.y))}if(target.turn>1.7+Math.random()*1.9){target.vx+=(Math.random()-.5)*.17;target.vy+=(Math.random()-.5)*.13;target.turn=0}target.vx=Math.max(-.4,Math.min(.4,target.vx));target.vy=Math.max(-.31,Math.min(.31,target.vy));target.angle=Math.atan2(target.vy,target.vx)*.13;
  if(Math.random()<.055){particles.push({x:target.x*w,y:target.y*h,vx:(Math.random()-.5)*12,vy:-10-Math.random()*18,life:.6+Math.random()*.35,max:1,size:2+Math.random()*3,emoji:target.kind==='fish'?'○':'✦'})}}
 drawToy(target.x*w,target.y*h,target.r,t);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=105*dt;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=Math.min(1,p.life/p.max);ctx.font=`${p.size*4}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#fff2ce';ctx.fillText(p.emoji,p.x,p.y)}ctx.globalAlpha=1;
 if(paused){ctx.fillStyle='#09122280';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.font='900 27px system-ui';ctx.fillStyle='white';ctx.fillText('ПАУЗА',w/2,h/2)}
}
requestAnimationFrame(frame);
document.querySelector('#pause').addEventListener('click',()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';document.querySelector('#pause').setAttribute('aria-label',paused?'Продолжить':'Пауза')});
document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔉':'🔇';e.currentTarget.setAttribute('aria-label',soundOn?'Звук включён':'Звук выключен');if(soundOn)playSound()});
const fullBtn=document.querySelector('#full');
function updateFullscreen(){const active=!!document.fullscreenElement||document.body.classList.contains('immersive');document.body.classList.toggle('immersive',active);fullBtn.textContent=active?'×':'⛶';fullBtn.setAttribute('aria-label',active?'Выйти из полного экрана':'Полный экран')}
fullBtn.addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen();updateFullscreen();return}const enter=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(enter){await enter.call(document.documentElement);updateFullscreen();try{await screen.orientation?.lock?.('landscape')}catch{}return}}catch{}document.body.classList.toggle('immersive');updateFullscreen();if(document.body.classList.contains('immersive')){tip.innerHTML='Режим игры включён. Чтобы скрыть панели Safari: нажми <b>Поделиться → На экран «Домой»</b>, затем открой игру с новой иконки.';tip.classList.add('show');clearTimeout(tipTimer);tipTimer=setTimeout(()=>tip.classList.remove('show'),6500);setTimeout(()=>window.scrollTo(0,1),50)}});
document.addEventListener('fullscreenchange',updateFullscreen);document.addEventListener('webkitfullscreenchange',updateFullscreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('immersive')){document.body.classList.remove('immersive');updateFullscreen()}});
setTimeout(()=>hint.style.opacity='0',8500);
})();
</script>
</body>
</html>
